#@TYPE: Machine
#@NAME: BeagleBoneBlack Printer
#@DESCRIPTION: Machine configuration for the BBB_printer 3d Printer

#@TYPE: Machine
#@NAME: BeagleBone machine
#@DESCRIPTION: Machine configuration for the http://beagleboard.org/bone board

require conf/machine/include/ti33x.inc
require conf/machine/include/beagle-bsp.inc

KERNEL_DEVICETREE_PREFIX = "ti/omap/am335x-bone ti/omap/am335x-bbb-printer"

# am335x-bbb-printer.dtb is added by the kernel patches in meta-bbb-printer
KERNEL_DEVICETREE:bsp-bb_org-6_12 = " \
ti/omap/am335x-bbb-printer.dtb \
ti/omap/am335x-boneblack.dtb \
ti/omap/am335x-boneblack-revd.dtb \
ti/omap/am335x-boneblack-uboot.dtb \
ti/omap/am335x-boneblack-uboot-univ.dtb \
ti/omap/am335x-boneblack-wireless.dtb \
"

SERIAL_CONSOLES = "115200;ttyS0"

# Install DTBs flat in /boot (meta-ti default is /boot/dtb/ti/omap/), so
# U-Boot finds /boot/${fdtfile} = /boot/am335x-bbb-printer.dtb, as selected
# by findfdt (u-boot patch 0018).
KERNEL_DTBDEST = "${KERNEL_IMAGEDEST}"
KERNEL_DTBVENDORED = "0"

# Use built-in LCD by default
XSERVER += "xf86-input-tslib"
MACHINE_GUI_CLASS = "smallscreen"
MACHINE_FEATURES += "screen touchscreen"

IMAGE_FSTYPES += "tar.gz"

SERIAL_CONSOLES = "115200;ttyS0"
#SERIAL_CONSOLE = "115200 ttyO0"

#UBOOT_MACHINE = "am335x_boneblack_config"
UBOOT_MACHINE = "am335x_evm_config"

MACHINE_EXTRA_RRECOMMENDS = " kernel-modules"
LINUX_KERNEL_TYPE = "tiny"

PACKAGECONFIG:append:pn-qtbase = " tslib"

#DISTRO_FEATURES:remove = " wayland"
DISTRO_FEATURES:remove = " wifi bluetooth"
